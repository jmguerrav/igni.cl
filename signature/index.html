<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Firma de correo — Igni</title>
<style>
  body{margin:0;font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;background:#f5f6f8;color:#0d0d0d;
       display:flex;flex-direction:column;align-items:center;padding:48px 20px;gap:28px}
  h1{font-size:18px;margin:0}
  p{font-size:14px;color:#555;max-width:520px;text-align:center;line-height:1.55;margin:0}
  .card{background:#fff;border:1px solid #e3e5e9;border-radius:12px;padding:28px 32px}
  button{font:600 14px/1 "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;color:#fff;background:#2F6FD6;
         border:0;border-radius:8px;padding:12px 22px;cursor:pointer}
  button:hover{background:#265cb4}
  .ok{color:#1a7f37;font-size:13px;visibility:hidden}
  kbd{background:#eceef1;border-radius:4px;padding:1px 5px;font-size:12px}
</style>
</head>
<body>
<h1>Firma de correo</h1>
<p>Pulsa <strong>Copiar firma</strong> y pégala en Gmail: ⚙️ → <em>Ver todos los ajustes</em> →
<em>Firma</em> → <em>Crear</em> → pegar con <kbd>⌘V</kbd> → <em>Guardar cambios</em> al final de la página.</p>

<div class="card" id="firma">
  <!-- ▼ LA FIRMA — todo con estilos en línea para sobrevivir a Gmail ▼ -->
  <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse">
    <tr>
      <td style="padding:0 18px 0 0;vertical-align:middle">
        <a href="https://igni.cl" target="_blank" style="text-decoration:none">
          <img src="https://igni.cl/signature/logo.png" width="88" height="36" alt="Igni"
               style="display:block;border:0;width:88px;height:36px">
        </a>
      </td>
      <td style="padding:0 0 0 18px;vertical-align:middle;border-left:2px solid #2F6FD6">
        <div style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;font-weight:700;color:#0d0d0d;line-height:1.4">
          José Manuel Guerra</div>
        <div style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;color:#555555;line-height:1.5">
          Director&nbsp;·&nbsp;Igni&nbsp;—&nbsp;Ingeniería&nbsp;&amp;&nbsp;Desarrollo</div>
        <div style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6">
          <a href="mailto:jose@igni.cl" style="color:#2F6FD6;text-decoration:none">jose@igni.cl</a>
          <span style="color:#b6bac1">&nbsp;·&nbsp;</span>
          <a href="https://igni.cl" target="_blank" style="color:#2F6FD6;text-decoration:none">igni.cl</a>
        </div>
      </td>
    </tr>
  </table>
  <!-- ▲ FIN DE LA FIRMA ▲ -->
</div>

<button id="btn">Copiar firma</button>
<span class="ok" id="ok">✓ Copiada — pégala en Gmail</span>

<script>
document.getElementById('btn').addEventListener('click', function () {
  var nodo = document.getElementById('firma');
  var sel = window.getSelection(); sel.removeAllRanges();
  var r = document.createRange(); r.selectNodeContents(nodo); sel.addRange(r);
  var hecho = false;
  try { hecho = document.execCommand('copy'); } catch (e) {}
  sel.removeAllRanges();
  if (hecho) {
    var ok = document.getElementById('ok'); ok.style.visibility = 'visible';
    setTimeout(function () { ok.style.visibility = 'hidden'; }, 4000);
  } else {
    alert('Selecciona la firma con el ratón y copia con ⌘C');
  }
});
</script>
</body>
</html>
